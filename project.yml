name: FamilyScheduling
options:
  bundleIdPrefix: ai.chrysalis
  deploymentTarget:
    iOS: "18.0"
packages:
  FamilyCore:
    path: Packages/FamilyCore
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  FamilyScheduling:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: FamilyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.chrysalis.familyscheduling
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Family Scheduling
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  FamilyScheduling:
    build:
      targets:
        FamilyScheduling: all
